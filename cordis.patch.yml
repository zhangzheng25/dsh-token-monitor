# dsh-plugin-token-usage bundle patch: contributes the plugin row into the
# host composition when this package is installed via `dsh plugin add`.
#
# The plugin is HOST-PLANE: it reads host services (sessionQuery, timer,
# webServer) and serves its snapshot over an HTTP route, and its client half
# registers a root-scoped settings page. It must therefore land in the host
# composition (this insert), never inside an agent preset.

- insert:
    - id: token-usage
      name: 'dsh-plugin-token-usage'
